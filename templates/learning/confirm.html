{% extends 'base.html' %}{% block content %}
<a class="back-link" href="{{ cancel_url }}">← 返回</a><section class="panel confirmation"><span class="eyebrow">请确认这项操作</span><h1>{{ title }}</h1><h2>{{ object_title }}</h2><p>{{ explanation }}</p>{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<div class="actions"><button type="submit" class="button danger-button">确认删除</button><a href="{{ cancel_url }}" class="button secondary">保留并返回</a></div></form></section>
{% endblock %}
