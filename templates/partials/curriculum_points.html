{% for point in curriculum_points %}<div class="curriculum-point"><span class="point-dot" aria-hidden="true"></span><a class="curriculum-point-name" href="{% url 'question-list' %}?course={{ course.pk }}&amp;point={{ point.pk }}&amp;archive=all">{{ point.name }}<small>{{ point.question_count }} 道关联错题{% if point.due_count %} · {{ point.due_count }} 道待复习{% endif %} →</small></a>{% if not course.is_archived %}<div class="row-actions"><a href="{% url 'point-edit' course.pk point.pk %}" aria-label="编辑知识点 {{ point.name }}">编辑</a><a href="{% url 'point-delete' course.pk point.pk %}" aria-label="删除知识点 {{ point.name }}">删除</a></div>{% endif %}</div>{% endfor %}
