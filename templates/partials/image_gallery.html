{% if question_images %}<div class="image-gallery">{% for image in question_images %}<figure><button type="button" class="learning-image-button" data-image-open data-image-url="{{ image.url }}" data-image-name="{{ image.name }}"><img src="{{ image.thumbnail_url }}" alt="{{ image.name }}" loading="lazy"><span>放大查看 ↗</span></button><figcaption>{% if image.role == 'question' %}题干{% elif image.role == 'original_answer' %}原答{% elif image.role == 'correct_answer' %}参考答案{% else %}错因{% endif %} · {{ image.name }}</figcaption></figure>{% endfor %}</div>{% endif %}
