{% if page_obj.has_other_pages %}<nav class="pagination" aria-label="分页"><span>共 {{ page_obj.paginator.count }} 条 · 第 {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 页</span><div>{% if page_obj.has_previous %}<a class="button secondary small" href="{% querystring page=page_obj.previous_page_number %}">上一页</a>{% endif %}{% if page_obj.has_next %}<a class="button secondary small" href="{% querystring page=page_obj.next_page_number %}">下一页</a>{% endif %}</div></nav>{% endif %}
