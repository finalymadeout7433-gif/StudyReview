<div class="analytics-grid diagnostic-grid" id="course-diagnostics">
  <section class="panel chart-card"><div class="panel-heading"><div><h2>课程 × 复习自评</h2></div><span class="scope-pill">所选复习区间与来源</span></div><div class="matrix-scroll" data-chart="rating-matrix" tabindex="0" role="region" aria-label="课程复习自评矩阵"></div></section>
  <section class="panel chart-card priority-panel"><div class="panel-heading"><div><h2>优先复习</h2></div><span class="scope-pill">模型辅助提示</span></div>{% for card in analytics.memory.priority_cards %}<a class="priority-question" href="{% url 'question-detail' card.id %}"><span><strong>{{ card.title }}</strong><small>{{ card.course }}{% if card.example %} · 含练习记录{% endif %}</small></span><b>{{ card.current }}<small>%</small></b></a>{% empty %}<p class="chart-empty">完成实际复习后，这里会按预测回忆概率提供提示。</p>{% endfor %}</section>
  <section class="panel chart-card workload-panel"><div class="panel-heading"><div><h2>未来14天学习负荷</h2></div><span class="scope-pill">当前任务与复习安排</span></div><div class="matrix-scroll workload-scroll" data-chart="workload" tabindex="0" role="region" aria-label="未来14天每门课的任务和复习条目"></div><p id="workload-focus" class="workload-focus" role="status">选择日期格查看安排。</p></section>
</div>
<section class="panel chart-card relationship-panel" id="knowledge-map"><div class="panel-heading"><div><h2>课程 · 知识点 · 错题关联图</h2></div><label class="graph-selector">查看课程<select id="relationship-course" aria-label="关联图课程"></select></label></div><div class="graph-scroll" tabindex="0" role="region" aria-label="可横向查看的课程知识关联图"><div data-chart="relationships" class="relationship-chart"></div></div></section>
