{% extends 'base.html' %}{% block auth_content %}
<header class="auth-masthead"><a class="brand" href="{% url 'login' %}"><span class="brand-mark" aria-hidden="true"></span><span>拾习<small>学习与复习管理</small></span></a></header>
<div class="auth-body"><section class="auth-story"><h1><span>学习有序，</span><span class="story-accent">温故知新。</span></h1><p>课程、任务、错题与复习，一处管理。</p><div class="study-path" aria-label="安排计划、记录错题、定期回顾"><div><span>01</span><strong>安排计划</strong></div><div><span>02</span><strong>记录错题</strong></div><div><span>03</span><strong>定期回顾</strong></div></div><p class="auth-footnote"><i class="live-dot" aria-hidden="true"></i>个人学习空间 · 资料保存在本机</p></section>
<section class="auth-card" aria-labelledby="login-heading"><h2 id="login-heading">欢迎回来</h2><form method="post" class="stack-form">{% csrf_token %}{% include 'partials/fields.html' %}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="button primary wide" type="submit">登录学习空间 <span aria-hidden="true">→</span></button></form><p class="auth-switch">第一次使用拾习？ <a href="{% url 'register' %}">创建账户</a></p></section></div><p class="auth-caption">拾习 STUDYREVIEW </p>{% endblock %}
